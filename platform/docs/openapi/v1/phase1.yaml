openapi: 3.1.0
info:
  title: R2M Platform API — Phase 1 (Identity & Organization, Verification)
  version: "1.0.0-phase1"
  description: |
    Covers only what Phase 1 implements: authentication, current-user profile,
    organization registration/membership, and organization verification review.
    Endpoints for Author & Resource, Technology Case, Assessment/Gap/Roadmap,
    Company & Discovery, and Transfer (architecture plan §9) are out of scope
    for this document and will get their own `docs/openapi/v1/phaseN.yaml`
    files as those phases land — do not add them here.

    Error responses always use the unified envelope from architecture plan §10,
    with a stable `code` from `packages/domain/src/errors/error-codes.ts` — see
    the shared `Error` schema below.
servers:
  - url: /v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: me
  - name: organizations
  - name: organization-verifications

paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with email + password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Issued token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials or suspended account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Issued token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: |
        Client-side token discard. No session table exists in the locked V5
        schema yet (see PHASE1_IMPLEMENTATION_NOTES.md §3), so this is a
        no-op on the server — it exists only to match the API catalogue and
        gives a stable place to add server-side revocation later.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Always succeeds; no response body

  /me:
    get:
      operationId: getMe
      summary: Current authenticated user identity + platform role
      tags: [me]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me/profile:
    get:
      operationId: getMyProfile
      summary: Current user's profile
      tags: [me]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateMyProfile
      summary: Update current user's profile fields
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations/register:
    post:
      operationId: registerOrganization
      summary: UC-ORG-01 — register a new organization + its owner account
      description: |
        Guest-only endpoint (no authenticated actor yet). Idempotency for this
        route does not go through the shared IdempotencyService (its
        `idempotency_key.user_id` column is NOT NULL and there is no user yet
        for a Guest actor) — a repeat request instead surfaces
        `ORG_ALREADY_EXISTS` / `AUTH_EMAIL_ALREADY_REGISTERED` from the unique
        constraint. See PHASE1_IMPLEMENTATION_NOTES.md §3 for why this is a
        known spec gap, not an oversight.
      tags: [organizations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOrganizationRequest"
      responses:
        "201":
          description: Organization created, PENDING_VERIFICATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "409":
          description: Organization name/slug or owner email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations:
    get:
      operationId: listMyOrganizations
      summary: Organizations the current user is a member of
      tags: [organizations]
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /organizations/{id}:
    get:
      operationId: getOrganizationById
      summary: Get one organization (caller must be a member, or PLATFORM_ADMIN/REVIEWER)
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"

  /organizations/{id}/verification-requests:
    post:
      operationId: resubmitOrganizationVerification
      summary: Re-submit a new verification request for a REJECTED organization
      tags: [organization-verifications]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "201":
          description: New verification request, PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A verification request is already pending for this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations/{id}/members/invitations:
    post:
      operationId: inviteOrganizationMember
      summary: SUC-02 — invite a member (ORG_ADMIN/ORG_ADMIN role only, never ORG_OWNER)
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Invited member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: User is already a member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations/{id}/members/{memberId}:
    patch:
      operationId: updateOrganizationMember
      summary: Change a member's role and/or status
      description: |
        `role` can never be set to ORG_OWNER here — ownership only changes via
        the dedicated transfer flow (not yet implemented in Phase 1).
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"

  /platform/organization-verifications:
    get:
      operationId: listPendingOrganizationVerifications
      summary: List pending organization verification requests (PLATFORM_REVIEWER/ADMIN)
      tags: [organization-verifications]
      responses:
        "200":
          description: Pending verification requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /platform/organization-verifications/{id}/claim:
    post:
      operationId: claimOrganizationVerification
      summary: Reviewer claims a pending request (PENDING -> IN_REVIEW)
      tags: [organization-verifications]
      parameters:
        - $ref: "#/components/parameters/VerificationRequestId"
      responses:
        "200":
          description: Claimed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Request already claimed or not in a claimable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /platform/organization-verifications/{id}/decision:
    post:
      operationId: decideOrganizationVerification
      summary: Approve or reject a claimed verification request
      description: |
        `reviewerNote` is required when `decision` is REJECT (enforced by the
        request schema before it reaches the domain service). The reviewer
        must not be the same user who submitted the request
        (VERIFICATION_REVIEWER_IS_SUBMITTER).
      tags: [organization-verifications]
      parameters:
        - $ref: "#/components/parameters/VerificationRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationVerificationDecisionRequest"
      responses:
        "200":
          description: Decided request (APPROVED or REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/DomainError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Stateless access token (short-lived). ActorContext (platform role +
        org memberships) is re-derived from the database on every request —
        the token only carries the user id (architecture plan §7.3).

  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerificationRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthenticated:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized for this resource/action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DomainError:
      description: Business-rule violation (see `code` for the exact reason)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: |
        Unified error envelope (architecture plan §10). `code` is one of the
        stable values in `packages/domain/src/errors/error-codes.ts` — never a
        free-form message. `traceId` echoes the inbound `X-Request-Id` header
        when present.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTH_INVALID_CREDENTIALS
                - AUTH_ACCOUNT_SUSPENDED
                - AUTH_INVALID_REFRESH_TOKEN
                - AUTH_UNAUTHENTICATED
                - AUTH_FORBIDDEN
                - AUTH_EMAIL_ALREADY_REGISTERED
                - ORG_ALREADY_EXISTS
                - ORG_NOT_FOUND
                - ORG_NOT_ACTIVE
                - ORG_INVALID_TRANSITION
                - ORG_VERSION_CONFLICT
                - ORG_CANNOT_REMOVE_LAST_OWNER
                - ORG_MEMBER_ALREADY_EXISTS
                - ORG_MEMBER_NOT_FOUND
                - ORG_NOT_MEMBER
                - VERIFICATION_ALREADY_PENDING
                - VERIFICATION_REQUEST_NOT_FOUND
                - VERIFICATION_REQUEST_CONFLICT
                - VERIFICATION_REVIEWER_IS_SUBMITTER
                - VERIFICATION_REASON_REQUIRED
                - VERIFICATION_INVALID_TRANSITION
                - SYSTEM_IDEMPOTENCY_KEY_REUSED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            traceId:
              type: [string, "null"]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token lifetime in seconds

    MeResponse:
      type: object
      required: [userId, primaryEmail, platformRole, displayName]
      properties:
        userId:
          type: string
          format: uuid
        primaryEmail:
          type: string
          format: email
        platformRole:
          type: string
          enum: [USER, PLATFORM_REVIEWER, PLATFORM_ADMIN]
        displayName:
          type: string

    UserProfileResponse:
      type: object
      required: [userId, displayName, firstName, lastName, phone, jobTitle, locale, timezone]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        jobTitle:
          type: [string, "null"]
        locale:
          type: string
        timezone:
          type: string

    UpdateProfileRequest:
      type: object
      description: All fields optional; only provided fields are updated.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        jobTitle:
          type: string
          maxLength: 150
        locale:
          type: string
          maxLength: 20
        timezone:
          type: string
          maxLength: 50

    RegisterOrganizationRequest:
      type: object
      required:
        [organizationName, organizationType, ownerEmail, ownerPassword, ownerDisplayName]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 255
        organizationType:
          type: string
          enum: [RESEARCH_UNIT, ENTERPRISE, GOVERNMENT, SUPPORT_ORGANIZATION]
        website:
          type: string
          format: uri
        taxCode:
          type: string
          maxLength: 100
        institutionIdentifier:
          type: string
          maxLength: 150
        ownerEmail:
          type: string
          format: email
        ownerPassword:
          type: string
          minLength: 8
          maxLength: 255
        ownerDisplayName:
          type: string
          minLength: 1
          maxLength: 200

    OrganizationResponse:
      type: object
      required: [id, name, slug, type, status, website, taxCode, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [RESEARCH_UNIT, ENTERPRISE, GOVERNMENT, SUPPORT_ORGANIZATION]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, REJECTED, SUSPENDED, ARCHIVED]
        website:
          type: [string, "null"]
        taxCode:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency version (architecture plan §7 rule 8)

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ORG_ADMIN, MEMBER]

    UpdateMemberRequest:
      type: object
      description: At least one of `role` or `status` must be provided.
      properties:
        role:
          type: string
          enum: [ORG_ADMIN, MEMBER]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, LEFT]

    OrganizationMemberResponse:
      type: object
      required: [id, organizationId, userId, role, status, invitedAt, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [ORG_OWNER, ORG_ADMIN, MEMBER]
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, LEFT]
        invitedAt:
          type: [string, "null"]
          format: date-time
        joinedAt:
          type: [string, "null"]
          format: date-time

    OrganizationVerificationDecisionRequest:
      type: object
      required: [decision]
      description: reviewerNote is required when decision is REJECT.
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reviewerNote:
          type: string
          maxLength: 2000

    OrganizationVerificationRequestResponse:
      type: object
      required:
        [id, organizationId, status, submittedByUserId, reviewerUserId, reviewerNote, submittedAt, reviewedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, IN_REVIEW, APPROVED, REJECTED, CANCELLED]
        submittedByUserId:
          type: string
          format: uuid
        reviewerUserId:
          type: [string, "null"]
          format: uuid
        reviewerNote:
          type: [string, "null"]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
