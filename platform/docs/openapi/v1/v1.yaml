openapi: 3.1.0
info:
  title: R2M Platform API
  version: "1.2.0"
  description: |
    Living document for the `/v1` API surface, versioned by API version — not by
    internal phase name (see B.0 in the Phase 2 implementation plan). Currently
    covers Identity & Organization, Verification (organization + author),
    Resource Catalog & Evidence, Technology Case (Phase 1-3), and Assessment &
    Gap + Roadmap (Phase 4 — Transfer half of Roadmap & Transfer lands in Phase
    6, same module/tag reused, not renamed). Endpoints for Company & Discovery
    (architecture plan §9) land here as those phases are implemented — do not
    fork this file per phase.

    Error responses always use the unified envelope from architecture plan §10,
    with a stable `code` from `packages/domain/src/errors/error-codes.ts` — see
    the shared `Error` schema below.
servers:
  - url: /v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: me
  - name: organizations
  - name: organization-verifications
  - name: author-verifications
  - name: resources
  - name: annotations
  - name: resource-access-grants
  - name: technology-cases
  - name: evidence
  - name: assessments
  - name: gaps
  - name: roadmaps

paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with email + password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Issued token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials or suspended account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Issued token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: |
        Client-side token discard. No session table exists in the locked V5
        schema yet (see PHASE1_IMPLEMENTATION_NOTES.md §3), so this is a
        no-op on the server — it exists only to match the API catalogue and
        gives a stable place to add server-side revocation later.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Always succeeds; no response body

  /me:
    get:
      operationId: getMe
      summary: Current authenticated user identity + platform role
      tags: [me]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me/profile:
    get:
      operationId: getMyProfile
      summary: Current user's profile
      tags: [me]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateMyProfile
      summary: Update current user's profile fields
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations/register:
    post:
      operationId: registerOrganization
      summary: UC-ORG-01 — register a new organization + its owner account
      description: |
        Guest-only endpoint (no authenticated actor yet). Idempotency for this
        route does not go through the shared IdempotencyService (its
        `idempotency_key.user_id` column is NOT NULL and there is no user yet
        for a Guest actor) — a repeat request instead surfaces
        `ORG_ALREADY_EXISTS` / `AUTH_EMAIL_ALREADY_REGISTERED` from the unique
        constraint. See PHASE1_IMPLEMENTATION_NOTES.md §3 for why this is a
        known spec gap, not an oversight.
      tags: [organizations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOrganizationRequest"
      responses:
        "201":
          description: Organization created, PENDING_VERIFICATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "409":
          description: Organization name/slug or owner email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations:
    get:
      operationId: listMyOrganizations
      summary: Organizations the current user is a member of
      tags: [organizations]
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /organizations/{id}:
    get:
      operationId: getOrganizationById
      summary: Get one organization (caller must be a member, or PLATFORM_ADMIN/REVIEWER)
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"

  /organizations/{id}/verification-requests:
    post:
      operationId: resubmitOrganizationVerification
      summary: Re-submit a new verification request for a REJECTED organization
      tags: [organization-verifications]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "201":
          description: New verification request, PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A verification request is already pending for this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations/{id}/members/invitations:
    post:
      operationId: inviteOrganizationMember
      summary: SUC-02 — invite a member (ORG_ADMIN/ORG_ADMIN role only, never ORG_OWNER)
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Invited member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: User is already a member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /organizations/{id}/members/{memberId}:
    patch:
      operationId: updateOrganizationMember
      summary: Change a member's role and/or status
      description: |
        `role` can never be set to ORG_OWNER here — ownership only changes via
        the dedicated transfer flow (not yet implemented in Phase 1).
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"

  /platform/organization-verifications:
    get:
      operationId: listPendingOrganizationVerifications
      summary: List pending organization verification requests (PLATFORM_REVIEWER/ADMIN)
      tags: [organization-verifications]
      responses:
        "200":
          description: Pending verification requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /platform/organization-verifications/{id}/claim:
    post:
      operationId: claimOrganizationVerification
      summary: Reviewer claims a pending request (PENDING -> IN_REVIEW)
      tags: [organization-verifications]
      parameters:
        - $ref: "#/components/parameters/VerificationRequestId"
      responses:
        "200":
          description: Claimed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Request already claimed or not in a claimable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /platform/organization-verifications/{id}/decision:
    post:
      operationId: decideOrganizationVerification
      summary: Approve or reject a claimed verification request
      description: |
        `reviewerNote` is required when `decision` is REJECT (enforced by the
        request schema before it reaches the domain service). The reviewer
        must not be the same user who submitted the request
        (VERIFICATION_REVIEWER_IS_SUBMITTER).
      tags: [organization-verifications]
      parameters:
        - $ref: "#/components/parameters/VerificationRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationVerificationDecisionRequest"
      responses:
        "200":
          description: Decided request (APPROVED or REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/DomainError"

  /author-verifications/uploads:
    post:
      operationId: requestAuthorVerificationUpload
      summary: UC-VER-01 step 1 — get a presigned URL to upload a verification document
      description: |
        Client PUTs the file directly to the returned `uploadUrl`, then calls
        `POST /author-verifications` with the same `storageObjectKey`. Only
        PDF/JPG/PNG up to 20 MB (operational cap, not spec-mandated).
      tags: [author-verifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAuthorVerificationUploadRequest"
      responses:
        "200":
          description: Presigned upload URL + object key to reference on submit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorVerificationUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/DomainError"

  /author-verifications:
    post:
      operationId: submitAuthorVerification
      summary: UC-VER-01 step 2 — submit the author verification request
      description: |
        Creates `author_profile` (if missing), the request, and the
        `verification_document` row in one transaction. The document's
        `checksum_sha256` is computed server-side by re-reading the object
        from S3 — a client-supplied checksum is never trusted.
      tags: [author-verifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAuthorVerificationRequest"
      responses:
        "201":
          description: Created request, PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: Already verified, or a request is already open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /platform/author-verifications:
    get:
      operationId: listPendingAuthorVerifications
      summary: List pending author verification requests (PLATFORM_REVIEWER/ADMIN)
      tags: [author-verifications]
      responses:
        "200":
          description: Pending verification requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /platform/author-verifications/{id}/claim:
    post:
      operationId: claimAuthorVerification
      summary: Reviewer claims a pending request (PENDING -> IN_REVIEW)
      tags: [author-verifications]
      parameters:
        - $ref: "#/components/parameters/VerificationRequestId"
      responses:
        "200":
          description: Claimed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Request already claimed or not in a claimable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/DomainError"

  /platform/author-verifications/{id}/document-url:
    get:
      operationId: getAuthorVerificationDocumentUrl
      summary: UC-VER-02 step 3 — presigned URL (TTL) to review the attached document
      description: |
        Path not listed in R2M_SPEC_DESIGN_V5_COMPLETE.md §13.2 — self-defined
        to satisfy the UC-VER-02 main flow (see Phase 2 plan B.0.1).
      tags: [author-verifications]
      parameters:
        - $ref: "#/components/parameters/VerificationRequestId"
      responses:
        "200":
          description: Short-lived signed GET URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"

  /platform/author-verifications/{id}/decision:
    post:
      operationId: decideAuthorVerification
      summary: Approve or reject a claimed author verification request
      description: |
        `reviewerNote` is required when `decision` is REJECT. The reviewer
        must not be the same user who submitted the request
        (VERIFICATION_REVIEWER_IS_SUBMITTER).
      tags: [author-verifications]
      parameters:
        - $ref: "#/components/parameters/VerificationRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorVerificationDecisionRequest"
      responses:
        "200":
          description: Decided request (APPROVED or REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorVerificationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/DomainError"

  /resources/uploads:
    post:
      operationId: requestResourceUpload
      summary: Get a presigned URL to upload a resource file
      description: |
        Not listed explicitly in §13.2 (UC-RES-01 input allows "external URL
        hoặc upload" but the catalogue only lists URL-oriented endpoints) —
        path mirrors `/author-verifications/uploads` (see Phase 2 plan B.0.1).
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestResourceUploadRequest"
      responses:
        "200":
          description: Presigned upload URL + object key to reference on register/version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /resources:
    post:
      operationId: registerResource
      summary: UC-RES-01 — register a resource + its first (DRAFT) version
      description: |
        Requires a VERIFIED author who is also an active member of
        `ownerOrganizationId`. Content location is exactly one of `sourceUrl`
        or `storageObjectKey`. Paper metadata fields are only valid when
        `type` is PAPER. Does not publish — call
        `POST /resource-versions/{id}/publish` separately.
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterResourceRequest"
      responses:
        "201":
          description: Created resource, status DRAFT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/DomainError"
    get:
      operationId: listResources
      summary: SUC-05 — full-text search, permission-filtered before returning results
      description: |
        Đã chốt sau review (2026-08-05): `?q=` searches
        title/description via Postgres full-text (GIN index); vector/semantic
        search is deferred until a real embedding pipeline exists (Phase 5). A resource
        is only returned if it is PUBLIC, owned by one of the caller's active
        organizations, or explicitly granted via `resource_access_grant`.
      tags: [resources]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Visible resources, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /resources/{id}:
    get:
      operationId: getResourceById
      summary: Get one resource (subject to the same visibility rule as list)
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"

  /resources/{id}/versions:
    post:
      operationId: createResourceVersion
      summary: Add a new DRAFT version to an existing resource
      description: Requires MANAGE (active ORG_OWNER/ORG_ADMIN of the owning organization).
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceVersionRequest"
      responses:
        "201":
          description: Created version, status DRAFT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"

  /resource-versions/{id}/publish:
    post:
      operationId: publishResourceVersion
      summary: UC-RES-01 step 5 — publish a DRAFT version
      description: |
        Publishing the resource's first version activates the resource
        (DRAFT -> ACTIVE). Publishing any later version supersedes the
        previously PUBLISHED one — cascade is mandatory (đã chốt sau review,
        2026-08-05), so no two versions are PUBLISHED at once. Resource/
        ResourceVersion state machine không nằm trong 10 state machine chính
        thức ở §8, tự đề xuất và đã được duyệt.
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/ResourceVersionId"
      responses:
        "200":
          description: Published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "409":
          description: Version cannot be published from its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /resource-versions/{id}/annotations:
    post:
      operationId: createAnnotation
      summary: UC-RES-02 — add an annotation to a resource version
      description: Requires MANAGE. Content must not be empty; version must not be WITHDRAWN.
      tags: [annotations]
      parameters:
        - $ref: "#/components/parameters/ResourceVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnotationRequest"
      responses:
        "201":
          description: Created annotation (revision 1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"

  /annotations/{id}/revisions:
    post:
      operationId: reviseAnnotation
      summary: UC-RES-02 — edit an annotation by inserting a new revision
      description: Never updates the previous revision in place — old revisions stay readable.
      tags: [annotations]
      parameters:
        - $ref: "#/components/parameters/AnnotationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseAnnotationRequest"
      responses:
        "201":
          description: New revision, annotation's latestRevisionNo bumped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"

  /annotations/{id}:
    delete:
      operationId: removeAnnotation
      summary: Soft-delete an annotation
      description: Sets `status = REMOVED` — does not delete the row (see `AnnotationStatus`).
      tags: [annotations]
      parameters:
        - $ref: "#/components/parameters/AnnotationId"
      responses:
        "204":
          description: Annotation removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"

  /resources/{id}/access-requests:
    post:
      operationId: createResourceAccessGrant
      summary: SUC-04 — grant access to a resource (đã chốt sau review, 2026-08-05)
      description: |
        Endpoint name matches §13.2 (`access-requests`), but creates a
        `resource_access_grant` with status ACTIVE immediately — the locked
        schema has no PENDING state or request entity for this flow (see
        Phase 2 plan B.0.1). Recipient is exactly one of `recipientUserId` or
        `recipientOrganizationId`. Requires MANAGE on the resource.
      tags: [resource-access-grants]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceAccessRequest"
      responses:
        "201":
          description: Created grant, status ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAccessGrantResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "409":
