    get:
      operationId: listMilestones
      summary: List milestones for a roadmap
      description: Path tự đặt ngoài catalogue §13.2 (đúng tiền lệ Phase 3 — read endpoint).
      tags: [roadmaps]
      parameters:
        - $ref: "#/components/parameters/RoadmapId"
      responses:
        "200":
          description: Milestones, ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoadmapMilestoneResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"

  /roadmaps/{id}/dependencies:
    post:
      operationId: createMilestoneDependency
      summary: UC-RDM-01 — link two milestones with a dependency edge
      description: |
        Port `prevent_milestone_dependency_cycle()` (SQL mẫu) sang app layer —
        BFS trên toàn bộ `milestone_dependency` hiện có của roadmap trước khi
        thêm edge mới (`MILESTONE_DEPENDENCY_CYCLE_DETECTED`). Cả 2 milestone
        phải thuộc cùng roadmap (`MILESTONE_DEPENDENCIES_MUST_BE_IN_SAME_ROADMAP`).
      tags: [roadmaps]
      parameters:
        - $ref: "#/components/parameters/RoadmapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDependencyRequest"
      responses:
        "201":
          description: Created dependency edge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDependencyResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"

  /roadmaps/{id}/submit:
    post:
      operationId: submitRoadmap
      summary: UC-RDM-01 — submit a roadmap for review
      description: Chuyển `DRAFT` → `IN_REVIEW`.
      tags: [roadmaps]
      parameters:
        - $ref: "#/components/parameters/RoadmapId"
      responses:
        "201":
          description: Submitted roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"

  /roadmaps/{id}/reviews:
    post:
      operationId: reviewRoadmap
      summary: UC-RDM-01 — review (approve/reject/request changes) an IN_REVIEW roadmap
      description: |
        Đã chốt sau review (2026-08-06, rule 12 CLAUDE.md): chỉ `CASE_REVIEWER`
        được gọi — KHÔNG gồm `OWNER` (tránh tự tạo roadmap rồi tự duyệt). Port
        `validate_roadmap_approval()` (SQL mẫu): `decision=APPROVED` chỉ pass
        khi roadmap có ≥1 milestone (`ROADMAP_HAS_NO_MILESTONES`) và không còn
        gap `CRITICAL` ở `OPEN`/`IN_PROGRESS`
        (`ROADMAP_HAS_UNRESOLVED_CRITICAL_GAPS`). Khi pass: roadmap `APPROVED`,
        event `RoadmapApproved`, case `ROADMAP_DRAFT` → `ROADMAP_APPROVED`.
        `CHANGES_REQUESTED` → roadmap quay lại `DRAFT` (đúng
        `RoadmapReviewDecision`, không phải `RoadmapStatus` — xem plan PHẦN D
        quyết định 1-2). `REJECTED` → roadmap `REJECTED` (terminal).
      tags: [roadmaps]
      parameters:
        - $ref: "#/components/parameters/RoadmapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoadmapReviewRequest"
      responses:
        "201":
          description: Reviewed roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"

  /milestones/{id}/tasks:
    post:
      operationId: createMilestoneTask
      summary: UC-RDM-01 — add a task under a milestone
      description: |
        Path tự đặt ngoài catalogue §13.2 (breakdown Sprint 4.4 yêu cầu, xem plan
        PHẦN D quyết định 8). Chỉ khi roadmap chứa milestone đang `DRAFT`.
      tags: [roadmaps]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapTaskResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"

  /milestones/{id}/gaps:
    post:
      operationId: linkMilestoneGap
      summary: UC-RDM-01 — link a gap to a milestone (mitigation tracking)
      description: |
        Path tự đặt ngoài catalogue §13.2 (breakdown Sprint 4.4 yêu cầu, xem plan
        PHẦN D quyết định 8). Gap phải thuộc cùng case với roadmap.
      tags: [roadmaps]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkMilestoneGapRequest"
      responses:
        "201":
          description: Linked (NestJS default POST status — handler returns void, no body)
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DomainError"
        "409":
          $ref: "#/components/responses/DomainError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Stateless access token (short-lived). ActorContext (platform role +
        org memberships) is re-derived from the database on every request —
        the token only carries the user id (architecture plan §7.3).

  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerificationRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceVersionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnnotationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TechnologyCaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssessmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GapId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoadmapId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MilestoneId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthenticated:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized for this resource/action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DomainError:
      description: Business-rule violation (see `code` for the exact reason)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: |
        Unified error envelope (architecture plan §10). `code` is one of the
        stable values in `packages/domain/src/errors/error-codes.ts` — never a
        free-form message. `traceId` echoes the inbound `X-Request-Id` header
        when present.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTH_INVALID_CREDENTIALS
                - AUTH_ACCOUNT_SUSPENDED
                - AUTH_INVALID_REFRESH_TOKEN
                - AUTH_UNAUTHENTICATED
                - AUTH_FORBIDDEN
                - AUTH_EMAIL_ALREADY_REGISTERED
                - ORG_ALREADY_EXISTS
                - ORG_NOT_FOUND
                - ORG_NOT_ACTIVE
                - ORG_INVALID_TRANSITION
                - ORG_VERSION_CONFLICT
                - ORG_CANNOT_REMOVE_LAST_OWNER
                - ORG_MEMBER_ALREADY_EXISTS
                - ORG_MEMBER_NOT_FOUND
                - ORG_NOT_MEMBER
                - VERIFICATION_ALREADY_PENDING
                - VERIFICATION_REQUEST_NOT_FOUND
                - VERIFICATION_REQUEST_CONFLICT
                - VERIFICATION_REVIEWER_IS_SUBMITTER
                - VERIFICATION_REASON_REQUIRED
                - VERIFICATION_INVALID_TRANSITION
                - SYSTEM_IDEMPOTENCY_KEY_REUSED
                - AUTHOR_ALREADY_VERIFIED
                - AUTHOR_VERIFICATION_DOCUMENT_INVALID
                - AUTHOR_INVALID_TRANSITION
                - RESOURCE_NOT_FOUND
                - RESOURCE_VERSION_NOT_FOUND
                - RESOURCE_VERSION_IMMUTABLE
                - RESOURCE_INVALID_TYPE_FOR_PAPER_METADATA
                - RESOURCE_CONTENT_NOT_FOUND
                - RESOURCE_INVALID_TRANSITION
                - RESOURCE_ACCESS_DENIED
                - RESOURCE_AUTHOR_NOT_VERIFIED
                - ANNOTATION_NOT_FOUND
                - ANNOTATION_EMPTY_CONTENT
                - ANNOTATION_TARGET_LOCATOR_INVALID
                - ACCESS_GRANT_NOT_FOUND
                - ACCESS_GRANT_DUPLICATE
                - ACCESS_GRANT_ALREADY_REVOKED
                - CASE_NOT_FOUND
                - CASE_CREATOR_NOT_VERIFIED_AUTHOR
                - CASE_OWNER_ALREADY_EXISTS
                - CASE_MEMBER_ALREADY_EXISTS
                - CASE_OWNER_NOT_IN_OWNING_ORG
                - CASE_MEMBER_NOT_ACTIVE_IN_ORGANIZATION
                - CASE_PARTNER_MEMBER_ORG_NOT_LINKED
                - CASE_ORGANIZATION_ROLE_NOT_ALLOWED
                - CASE_INVALID_TRANSITION
                - EVIDENCE_NOT_FOUND
                - CASE_EVIDENCE_REQUIRES_CITATION
                - CASE_EVIDENCE_ROLE_NOT_ALLOWED
                - ASSESSMENT_NOT_FOUND
                - ASSESSMENT_HAS_NO_SCORES
                - ASSESSMENT_SCORE_OUT_OF_RANGE
                - ASSESSMENT_CRITERION_NOT_FOUND
                - ASSESSMENT_CRITERION_FRAMEWORK_MISMATCH
                - ASSESSMENT_SCORE_MISSING_EVIDENCE
                - ASSESSMENT_SCORE_MISSING_CITATION
                - ASSESSMENT_INVALID_TRANSITION
                - ASSESSMENT_FRAMEWORK_NOT_FOUND
                - GAP_NOT_FOUND
                - GAP_SEVERITY_REQUIRED
                - GAP_MISSING_SUPPORT
                - GAP_RESOLUTION_NOTE_REQUIRED
                - GAP_INVALID_TRANSITION
                - ROADMAP_NOT_FOUND
                - MILESTONE_NOT_FOUND
                - MILESTONE_DEPENDENCY_CYCLE_DETECTED
                - MILESTONE_DEPENDENCIES_MUST_BE_IN_SAME_ROADMAP
                - ROADMAP_HAS_NO_MILESTONES
                - ROADMAP_HAS_UNRESOLVED_CRITICAL_GAPS
                - ROADMAP_INVALID_TRANSITION
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            traceId:
              type: [string, "null"]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token lifetime in seconds

    MeResponse:
      type: object
      required: [userId, primaryEmail, platformRole, displayName]
      properties:
        userId:
          type: string
          format: uuid
        primaryEmail:
          type: string
          format: email
        platformRole:
          type: string
          enum: [USER, PLATFORM_REVIEWER, PLATFORM_ADMIN]
        displayName:
          type: string

    UserProfileResponse:
      type: object
      required: [userId, displayName, firstName, lastName, phone, jobTitle, locale, timezone]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        jobTitle:
          type: [string, "null"]
        locale:
          type: string
        timezone:
          type: string

    UpdateProfileRequest:
      type: object
      description: All fields optional; only provided fields are updated.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        jobTitle:
          type: string
          maxLength: 150
        locale:
          type: string
          maxLength: 20
        timezone:
          type: string
          maxLength: 50

    RegisterOrganizationRequest:
      type: object
      required:
        [organizationName, organizationType, ownerEmail, ownerPassword, ownerDisplayName]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 255
        organizationType:
          type: string
          enum: [RESEARCH_UNIT, ENTERPRISE, GOVERNMENT, SUPPORT_ORGANIZATION]
        website:
          type: string
          format: uri
        taxCode:
          type: string
          maxLength: 100
        institutionIdentifier:
          type: string
          maxLength: 150
        ownerEmail:
          type: string
          format: email
        ownerPassword:
          type: string
          minLength: 8
          maxLength: 255
        ownerDisplayName:
          type: string
          minLength: 1
          maxLength: 200

    OrganizationResponse:
      type: object
      required: [id, name, slug, type, status, website, taxCode, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [RESEARCH_UNIT, ENTERPRISE, GOVERNMENT, SUPPORT_ORGANIZATION]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, REJECTED, SUSPENDED, ARCHIVED]
        website:
          type: [string, "null"]
        taxCode:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency version (architecture plan §7 rule 8)

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ORG_ADMIN, MEMBER]

    UpdateMemberRequest:
      type: object
      description: At least one of `role` or `status` must be provided.
      properties:
        role:
          type: string
          enum: [ORG_ADMIN, MEMBER]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, LEFT]

    OrganizationMemberResponse:
      type: object
      required: [id, organizationId, userId, role, status, invitedAt, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [ORG_OWNER, ORG_ADMIN, MEMBER]
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, LEFT]
        invitedAt:
          type: [string, "null"]
          format: date-time
        joinedAt:
          type: [string, "null"]
          format: date-time

    OrganizationVerificationDecisionRequest:
      type: object
      required: [decision]
      description: reviewerNote is required when decision is REJECT.
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reviewerNote:
          type: string
          maxLength: 2000

    OrganizationVerificationRequestResponse:
      type: object
      required:
        [id, organizationId, status, submittedByUserId, reviewerUserId, reviewerNote, submittedAt, reviewedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, IN_REVIEW, APPROVED, REJECTED, CANCELLED]
        submittedByUserId:
          type: string
          format: uuid
        reviewerUserId:
          type: [string, "null"]
          format: uuid
        reviewerNote:
          type: [string, "null"]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time

    RequestAuthorVerificationUploadRequest:
      type: object
      required: [documentType, originalFilename, mimeType, sizeBytes]
      properties:
        documentType:
          type: string
          enum: [IDENTITY_DOCUMENT, AFFILIATION_PROOF, ORGANIZATION_LETTER, TAX_DOCUMENT, OTHER]
        originalFilename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520

    AuthorVerificationUploadResponse:
      type: object
      required: [uploadUrl, storageObjectKey, expiresIn]
      properties:
        uploadUrl:
          type: string
          format: uri
        storageObjectKey:
          type: string
        expiresIn:
          type: integer
          description: Seconds until uploadUrl expires

    SubmitAuthorVerificationRequest:
      type: object
      required:
        [affiliationOrgId, documentStorageObjectKey, documentType, originalFilename, mimeType, sizeBytes]
      properties:
        affiliationOrgId:
          type: string
          format: uuid
        submittedNote:
          type: string
          maxLength: 2000
        documentStorageObjectKey:
          type: string
          minLength: 1
        documentType:
          type: string
          enum: [IDENTITY_DOCUMENT, AFFILIATION_PROOF, ORGANIZATION_LETTER, TAX_DOCUMENT, OTHER]
        originalFilename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520

    AuthorVerificationDecisionRequest:
      type: object
      required: [decision]
      description: reviewerNote is required when decision is REJECT.
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reviewerNote:
          type: string
          maxLength: 2000

    AuthorVerificationRequestResponse:
      type: object
      required:
        [id, authorUserId, affiliationOrgId, status, submittedNote, reviewerUserId, reviewerNote, submittedAt, reviewedAt]
      properties:
        id:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        affiliationOrgId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, IN_REVIEW, APPROVED, REJECTED, CANCELLED]
        submittedNote:
          type: [string, "null"]
        reviewerUserId:
          type: [string, "null"]
          format: uuid
        reviewerNote:
          type: [string, "null"]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time

    PresignedUrlResponse:
      type: object
      required: [url, expiresIn]
      properties:
        url:
          type: string
          format: uri
        expiresIn:
          type: integer

    RequestResourceUploadRequest:
      type: object
      required: [originalFilename, mimeType, sizeBytes]
      properties:
        originalFilename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 150
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 209715200

    ResourceUploadResponse:
      type: object
      required: [uploadUrl, storageObjectKey, expiresIn]
      properties:
        uploadUrl:
          type: string
          format: uri
        storageObjectKey:
          type: string
        expiresIn:
          type: integer

    RegisterResourceRequest:
      type: object
      required: [ownerOrganizationId, type, title, accessLevel]
      description: |
        Exactly one of `sourceUrl` or `storageObjectKey` is required. Paper
        metadata fields (doi/abstract/publisher/venue/publicationDate/language)
        are only valid when `type` is PAPER.
      properties:
        ownerOrganizationId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            [PAPER, REPORT, DATASET, MODEL, CHECKPOINT, SOURCE_CODE, PATENT, LICENSE,
             ARCHITECTURE_DOCUMENT, EXPERIMENT_RESULT, PILOT_EVIDENCE, VIDEO, OTHER]
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        accessLevel:
          type: string
          enum: [PUBLIC, ORGANIZATION, CASE_ONLY, APPROVAL_REQUIRED, PRIVATE]
        externalIdentifier:
          type: string
          maxLength: 255
        sourceUrl:
          type: string
          format: uri
        storageObjectKey:
          type: string
        doi:
          type: string
          maxLength: 255
        abstract:
          type: string
        publisher:
          type: string
          maxLength: 255
        venue:
          type: string
          maxLength: 255
        publicationDate:
          type: string
          format: date
        language:
          type: string
          maxLength: 20

    ResourceResponse:
      type: object
      required:
        [id, ownerOrganizationId, createdByUserId, type, title, description, accessLevel,
         status, moderationStatus, externalIdentifier, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        ownerOrganizationId:
          type: string
          format: uuid
        createdByUserId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        accessLevel:
          type: string
          enum: [PUBLIC, ORGANIZATION, CASE_ONLY, APPROVAL_REQUIRED, PRIVATE]
        status:
          type: string
          description: "Đã chốt sau review (2026-08-05). ARCHIVED/WITHDRAWN không cascade xuống ResourceVersion."
          enum: [DRAFT, ACTIVE, ARCHIVED, WITHDRAWN]
        moderationStatus:
          type: string
          enum: [ACTIVE, HIDDEN, REMOVED]
        externalIdentifier:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CreateResourceVersionRequest:
      type: object
      description: Exactly one of `sourceUrl` or `storageObjectKey` is required.
      properties:
        versionLabel:
          type: string
          maxLength: 100
        sourceUrl:
          type: string
          format: uri
        storageObjectKey:
          type: string

    ResourceVersionResponse:
      type: object
      required:
        [id, resourceId, versionNo, versionLabel, sourceUrl, storageObjectKey,
         contentHashSha256, publishedAt, status, createdByUserId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        versionNo:
          type: integer
        versionLabel:
          type: [string, "null"]
        sourceUrl:
