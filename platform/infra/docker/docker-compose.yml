name: r2m-v5-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: r2m
      POSTGRES_PASSWORD: r2m
      POSTGRES_DB: r2m_dev
    ports:
      - "5432:5432"
    volumes:
      - r2m-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2m -d r2m_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: r2m
      MINIO_ROOT_PASSWORD: r2m-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - r2m-minio-data:/data

volumes:
  r2m-postgres-data:
  r2m-minio-data:
