name: CI

on:
  push:
  pull_request:

# The pnpm workspace (package.json, pnpm-workspace.yaml, turbo.json) lives in
# `platform/`, not the repo root — every step below runs there.
defaults:
  run:
    working-directory: platform

env:
  # CI-only placeholder values — NOT production secrets. They only need to match the
  # credentials hardcoded in infra/docker/docker-compose.yml (also non-production, local
  # dev defaults) so the app can connect to the containers started in this same job.
  NODE_ENV: test
  API_PORT: "3000"
  DATABASE_URL: postgres://r2m:r2m@localhost:5432/r2m_dev
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: r2m
  S3_SECRET_ACCESS_KEY: r2m-secret
  S3_VERIFICATION_BUCKET: r2m-verification-private
  S3_RESOURCE_BUCKET: r2m-resource-private
  S3_SIGNED_URL_TTL_SECONDS: "300"
  JWT_ACCESS_SECRET: ci-only-access-secret-not-for-prod-use
  JWT_ACCESS_TTL_SECONDS: "900"
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-prod-use
  JWT_REFRESH_TTL_SECONDS: "2592000"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuses the exact same compose file developers run locally (README §3.2) — no
      # separate Postgres/Redis/MinIO service definitions here, so CI and local dev can
      # never silently drift apart.
      - name: Start infra (Postgres/Redis/MinIO)
        run: docker compose -f infra/docker/docker-compose.yml up -d

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose -f infra/docker/docker-compose.yml exec -T postgres pg_isready -U r2m -d r2m_dev; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Tear down infra
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
